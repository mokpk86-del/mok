<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Rain Perfect 💖</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}
</style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

<script>
const canvas = document.getElementById('rainCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const text = "I love you";
const fontSize = 15;
const lineHeight = 25; // កំណត់ចន្លោះជួរឱ្យតគ្នាជាប់
let columns = Math.floor(canvas.width / 110);
let drops = [];

for (let i = 0; i < columns; i++) {
    drops[i] = Math.floor(Math.random() * -200);
}

function animate() {
    // ប្រើផ្ទៃខ្មៅសុទ្ធ អត់មានដានក្រហម
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = 'bold ' + fontSize + 'px monospace';
    
    for (let i = 0; i < columns; i++) {
        ctx.fillStyle = '#ff3366';
        ctx.shadowBlur = 7;
        ctx.shadowColor = '#ff0033';
        
        let x = i * (canvas.width / columns) + 15;
        
        // គូរអក្សរឱ្យច្រើនជួរតៗគ្នាក្នុង Column នីមួយៗ (j < 100) ដើម្បីកុំឱ្យវាដាច់
        for (let j = 0; j < 100; j++) {
            let y = (drops[i] + j) * lineHeight;
            ctx.fillText(text, x, y);
        }

        // បើធ្លាក់ហួសបាតក្រោម ឱ្យវាទម្លាក់ពីលើមកវិញតគ្នារហូត
        if (drops[i] * lineHeight > canvas.height) {
            drops[i] = -50;
        }
        
        // ល្បឿនធ្លាក់យឺតល្មមស្អាត
        drops[i] += 0.3;
    }

    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
